<body><main id="shell" aria-label="Gumball: Aventura em Elmore"><canvas id="game" width="960" height="540" aria-label="Cenário do jogo de plataforma"></canvas><div id="ui"></div></main>
<script>
'use strict';
// All artwork, music and simulation live in this file. No network requests.
let W=960;
const H=540,TAU=Math.PI*2,$=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const CHARACTERS=[
 {name:'Gumball',full:'Gumball Watterson',color:'#29bcec',accent:'#99ecff',speed:295,jump:630,hp:6,damage:1,rate:.23,stats:[5,3,3],desc:'Rápido, impulsivo e pronto para o caos.',power:'Bolas de energia azul',special:'Super dash',cooldown:3.8},
 {name:'Darwin',full:'Darwin Watterson',color:'#ff9e3e',accent:'#ffe18f',speed:270,jump:690,hp:6,damage:1.15,rate:.32,stats:[4,3,5],desc:'Um grande coração. E saltos ainda maiores.',power:'Bolhas aquáticas',special:'Salto duplo',cooldown:0},
 {name:'Boberto',full:'Boberto',color:'#a4bdc9',accent:'#a5ffe2',speed:235,jump:625,hp:8,damage:2,rate:.40,stats:[3,5,3],desc:'Circuitos ligados. Defesa reforçada.',power:'Raio elétrico em cadeia',special:'Escudo tecnológico',cooldown:7},
 {name:'Alan',full:'Alan, o balão',color:'#ef99bd',accent:'#ffd4e9',speed:255,jump:565,hp:6,damage:1.1,rate:.29,stats:[4,3,4],desc:'Leve como o vento. Gentil até na batalha.',power:'Rajada de ar',special:'Flutuação por 2,4 s',cooldown:6}
];
const DEFAULTS={master:.65,sfx:.8,music:.25,sound:true,particles:true,shake:true,quality:'high',difficulty:'normal'};
class SaveManager{
 constructor(){this.key='elmore-adventure-v1';this.data={selected:0,unlocked:0,best:0,records:[0,0,0,0],settings:{...DEFAULTS},campaign:null};try{const d=JSON.parse(localStorage.getItem(this.key));if(d&&typeof d==='object'){
 this.data.selected=Number.isInteger(d.selected)?clamp(d.selected,0,3):0;this.data.unlocked=Number.isInteger(d.unlocked)?clamp(d.unlocked,0,3):0;this.data.best=Number.isFinite(d.best)?Math.max(0,d.best):0;
 if(Array.isArray(d.records))this.data.records=this.data.records.map((_,i)=>Number.isFinite(d.records[i])?Math.max(0,d.records[i]):0);
 if(d.settings&&typeof d.settings==='object'){for(const k of ['master','sfx','music'])if(Number.isFinite(d.settings[k]))this.data.settings[k]=clamp(d.settings[k],0,1);for(const k of ['sound','particles','shake'])if(typeof d.settings[k]==='boolean')this.data.settings[k]=d.settings[k];for(const [k,vals]of Object.entries({quality:['low','medium','high'],difficulty:['easy','normal','hard']}))if(vals.includes(d.settings[k]))this.data.settings[k]=d.settings[k];}
 const c=d.campaign;if(c&&Number.isInteger(c.level)&&c.level>=0&&c.level<4&&Number.isFinite(c.score)&&Number.isFinite(c.stars)&&Number.isFinite(c.time)&&Number.isInteger(c.lives)&&c.lives>0&&c.lives<=9){this.data.campaign={level:c.level,score:clamp(c.score,0,99999999),stars:clamp(c.stars,0,99999),time:clamp(c.time,0,999999),lives:c.lives,checkpoint:Number.isFinite(c.checkpoint)?clamp(c.checkpoint,80,6000):80,collected:Array.isArray(c.collected)?c.collected.filter(v=>typeof v==='string').slice(0,400):[],defeated:Array.isArray(c.defeated)?c.defeated.filter(v=>typeof v==='string').slice(0,100):[]};}
 }}catch(e){} }
 write(){try{localStorage.setItem(this.key,JSON.stringify(this.data));}catch(e){}}
}
class SettingsManager{constructor(save){this.save=save;this.values=save.data.settings;}set(k,v){this.values[k]=v;this.save.write();}get difficulty(){return{easy:.70,normal:1,hard:1.35}[this.values.difficulty];}}
class AudioManager{
 constructor(settings){this.settings=settings;this.ctx=null;this.next=0;this.note=0;this.active=0;}
 unlock(){try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});}catch(e){}}
 tone(f=440,d=.1,type='sine',volume=.2,end=0,music=false){const s=this.settings.values;if(!this.ctx||!s.sound||this.ctx.state!=='running'||this.active>22)return;try{let t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();this.active++;o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(Math.max(30,end),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,volume*s.master*(music?s.music:s.sfx)),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d+.02);o.onended=()=>{this.active--;o.disconnect();g.disconnect();};}catch(e){this.active=Math.max(0,this.active-1);}}
 play(kind){const p={jump:[370,.15,'triangle',.16,700],land:[100,.06,'triangle',.08,60],attack:[650,.1,'sine',.16,180],special:[240,.3,'triangle',.19,1200],hit:[150,.15,'sawtooth',.12,45],star:[980,.11,'sine',.12,1480],enemy:[340,.15,'square',.06,70],click:[740,.055,'sine',.10,900],boss:[85,.25,'sawtooth',.12,35],checkpoint:[520,.3,'sine',.16,1040],victory:[523,.4,'triangle',.18,1046]};this.tone(...(p[kind]||p.click));}
 update(dt,state){if(!this.ctx||['PAUSED','SETTINGS','GAME_OVER'].includes(state))return;this.next-=dt;if(this.next<=0){this.next=.24;const song=state==='PLAYING'?[0,7,12,7,3,10,15,10,5,12,17,12,3,10,7,3]:[0,4,7,12,7,4,2,7,5,9,12,17,12,9,7,2];const n=song[this.note%song.length];this.tone(220*2**(n/12),.19,'triangle',.10,0,true);if(this.note%4===0)this.tone(110*2**(n/12),.30,'sine',.12,0,true);this.note++;}}
}
class InputManager{
 constructor(game){this.game=game;this.down=new Set();this.pressed=new Set();this.map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyJ:'attack',KeyZ:'attack',KeyK:'special',KeyX:'special'};
 window.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;const a=this.map[e.code];if(a){e.preventDefault();if(!e.repeat)this.pressed.add(a);this.down.add(a);}if(!e.repeat&&(e.code==='Escape'||e.code==='KeyP')){e.preventDefault();game.togglePause();}if(!e.repeat&&e.code==='KeyR'&&game.state==='GAME_OVER')game.retry();});
 window.addEventListener('keyup',e=>{if(this.map[e.code]){e.preventDefault();this.down.delete(this.map[e.code]);}});
 window.addEventListener('blur',()=>{this.clear();if(game.state==='PLAYING')game.pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.state==='PLAYING')game.pause();});
 }clear(){this.down.clear();this.pressed.clear();}held(k){return this.down.has(k);}hit(k){return this.pressed.has(k);}end(){this.pressed.clear();}
}
class ParticleSystem{
 constructor(game){this.game=game;this.items=[];}
 burst(x,y,color,count=12,speed=140){if(!this.game.settings.values.particles)return;const q=this.game.settings.values.quality;count=Math.ceil(count*(q==='low'?.4:q==='medium'?.7:1));for(let i=0;i<count&&this.items.length<260;i++){let a=Math.random()*TAU,v=speed*(.3+Math.random()*.7);this.items.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-45,life:.3+Math.random()*.4,max:.7,color,r:2+Math.random()*3});}}
 update(dt){for(const p of this.items){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;}this.items=this.items.filter(p=>p.life>0);}
 draw(c){for(const p of this.items){c.globalAlpha=Math.min(1,p.life*3);c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.r*Math.min(1,p.life*4),0,TAU);c.fill();}c.globalAlpha=1;}
}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
class Physics{
 static move(e,dt,level){e.grounded=false;e.support=null;e.x+=e.vx*dt;for(const p of level.platforms){if(p.gone)continue;if(overlap(e,p)){if(e.vx>0)e.x=p.x-e.w;else if(e.vx<0)e.x=p.x+p.w;e.vx=0;}}
 const oldBottom=e.y+e.h;e.y+=e.vy*dt;for(const p of level.platforms){if(p.gone)continue;if(overlap(e,p)){if(e.vy>=0&&oldBottom<=p.y+Math.max(5,Math.abs(p.dy||0)+2)){e.y=p.y-e.h;e.vy=0;e.grounded=true;e.support=p;}else if(e.vy<0){e.y=p.y+p.h;e.vy=0;}}}
 e.x=clamp(e.x,0,level.width-e.w);
 }
}
class Camera{constructor(){this.x=0;this.shake=0;}update(dt,p,l){let target=clamp(p.x-W*.37,0,l.width-W);this.x=lerp(this.x,target,1-Math.exp(-7*dt));this.shake=Math.max(0,this.shake-dt*28);}}
class Player{
 constructor(game,x=80,y=360){this.game=game;this.id=game.save.data.selected;this.spec=CHARACTERS[this.id];this.x=x;this.y=y;this.w=36;this.h=61;this.vx=0;this.vy=0;this.dir=1;this.hp=this.spec.hp;this.grounded=false;this.coyote=0;this.buffer=0;this.jumps=0;this.inv=1.4;this.attackCD=0;this.specialCD=0;this.shield=0;this.float=0;this.dash=0;this.anim=0;this.attackAnim=0;this.dead=false;this.deathT=0;this.support=null;}
 update(dt){const g=this.game,I=g.input;this.anim+=dt;for(const k of ['inv','attackCD','specialCD','shield','float','dash','attackAnim'])this[k]=Math.max(0,this[k]-dt);
 if(this.dead){this.deathT+=dt;this.y+=this.vy*dt;this.vy+=1300*dt;if(this.deathT>.9)g.respawn();return;}
 if(this.support&&!this.support.gone){this.x+=this.support.dx||0;this.y+=this.support.dy||0;}
 if(this.grounded){this.coyote=.12;this.jumps=0;}else this.coyote=Math.max(0,this.coyote-dt);
 if(I.hit('jump'))this.buffer=.14;else this.buffer=Math.max(0,this.buffer-dt);
 if(this.buffer>0&&(this.coyote>0||(this.id===1&&this.jumps<2))){this.jump();this.buffer=0;}
 if(I.hit('special'))this.special();
 const direction=(I.held('right')?1:0)-(I.held('left')?1:0);if(direction)this.dir=direction;
 if(this.dash>0){this.vx=this.dir*860;this.vy=0;if(Math.random()<.5)g.particles.burst(this.x+18,this.y+35,'#7ceaff',2,35);}else{let accel=this.grounded?2100:1600;if(this.id===3)accel=2050;this.vx=lerp(this.vx,direction*this.spec.speed,Math.min(1,dt*(direction?accel/this.spec.speed:13)));let gravity=this.id===3?1350:1780;if(!I.held('jump')&&this.vy<-170)this.vy+=2600*dt;if(this.float>0){gravity=250;this.vy=Math.min(48,this.vy);}this.vy=Math.min(820,this.vy+gravity*dt);}
 const was=this.grounded;Physics.move(this,dt,g.level);if(this.grounded&&!was){g.audio.play('land');g.particles.burst(this.x+18,this.y+61,'#fcf4d5',5,75);}if(this.support&&this.support.type==='crumble'&&this.support.timer===null)this.support.timer=.8;
 if(this.grounded&&Math.abs(this.vx)>100&&Math.random()<dt*12)g.particles.burst(this.x+18,this.y+60,'#fff5d9',2,40);
 if(I.held('attack')&&this.attackCD<=0)this.attack();
 if(this.y>H+120)this.hurt(99,true);
 }
 jump(){this.vy=-this.spec.jump;this.grounded=false;this.coyote=0;this.jumps++;this.game.audio.play('jump');this.game.particles.burst(this.x+18,this.y+61,this.jumps>1?'#a8edff':'#fff6da',9,110);}
 special(){if(this.specialCD>0)return;const g=this.game;if(this.id===0){this.dash=.19;this.inv=Math.max(this.inv,.25);this.specialCD=this.spec.cooldown;}
 if(this.id===1){if(this.grounded||this.jumps>=2)return;this.jump();}
 if(this.id===2){this.shield=3;this.specialCD=this.spec.cooldown;}
 if(this.id===3){this.float=2.4;this.specialCD=this.spec.cooldown;this.vy=Math.min(this.vy,-90);}
 g.audio.play('special');g.particles.burst(this.x+18,this.y+30,this.spec.accent,20,180);}
 attack(){this.attackCD=this.spec.rate;this.attackAnim=.16;const g=this.game;g.audio.play('attack');let b=new Projectile(this.x+18+this.dir*26,this.y+27,this.dir*(this.id===2?740:560),0,this.id,this.spec.damage);if(this.id===1)b.aoe=(g.shots++%3===2);g.projectiles.push(b);g.particles.burst(b.x,b.y,this.spec.accent,3,60);}
 hurt(amount,fall=false){if(this.dead||(!fall&&(this.inv>0||this.shield>0||this.dash>0)))return;const g=this.game;this.hp=Math.max(0,this.hp-amount*(fall?1:g.settings.difficulty)*(this.id===2&&!fall?.7:1));this.inv=1.25;this.vx=-this.dir*230;this.vy=-270;g.audio.play('hit');g.particles.burst(this.x+18,this.y+30,'#ff7d9c',18);g.camera.shake=g.settings.values.shake?7:0;if(this.hp<=0){this.dead=true;this.deathT=0;this.vy=-330;g.input.clear();}}
}

 notify(t,d=2){this.ui.toast(t,d);}
 startNew(){this.score=0;this.stars=0;this.lives=3;this.totalTime=0;this.levelIndex=0;this.collected.clear();this.defeated.clear();this.checkpoint=80;this.loadLevel(0);this.store();}
 loadLevel(index,resume=false){this.levelIndex=index;this.levelTime=0;this.projectiles=[];this.lightnings=[];this.particles.items=[];this.camera=new Camera();LevelManager.create(index,this);if(!resume){this.checkpoint=80;this.collected.clear();this.defeated.clear();}this.checkpoint=clamp(this.checkpoint,80,this.level.width-1050);for(const it of this.level.items)it.taken=this.collected.has(it.id);for(const en of this.enemies)if(this.defeated.has(en.id))en.dead=true;for(const b of this.bosses)if(this.defeated.has(b.id)){b.dead=true;b.deathT=2;}for(const cp of this.level.checkpoints)if(cp.x<=this.checkpoint)cp.active=true;this.player=new Player(this,this.checkpoint===80&&matchMedia('(pointer:coarse)').matches?220:this.checkpoint,400);this.camera.x=clamp(this.player.x-W*.37,0,this.level.width-W);this.transition=1;this.setState('PLAYING');this.notify('0'+(index+1)+' · '+this.level.name,2.7);}
 resumeSave(){const s=this.save.data.campaign;if(!s)return;this.levelIndex=s.level;this.score=s.score;this.stars=s.stars;this.lives=s.lives;this.totalTime=s.time;this.checkpoint=s.checkpoint;this.collected=new Set(s.collected);this.defeated=new Set(s.defeated);this.loadLevel(s.level,true);}
 store(){if(!this.level||this.lives<=0)return;this.save.data.campaign={level:this.levelIndex,score:this.score,stars:this.stars,lives:this.lives,time:this.totalTime,checkpoint:this.checkpoint,collected:[...this.collected],defeated:[...this.defeated]};this.save.data.best=Math.max(this.save.data.best,this.score);this.save.write();}
 pause(){if(this.state!=='PLAYING')return;this.store();this.setState('PAUSED');}
 togglePause(){if(this.state==='PLAYING')this.pause();else if(this.state==='PAUSED')this.setState('PLAYING');else if(['SETTINGS','HOW_TO_PLAY','CREDITS','CHARACTER_SELECT'].includes(this.state))this.action('back');}
 action(a){if(a.startsWith('char-')){this.selected=+a.slice(5);this.ui.render();return;}
 switch(a){case'play':this.immersive();this.menuOrigin='TITLE';this.selectPurpose='new';this.selected=this.save.data.selected;this.setState('CHARACTER_SELECT');break;
 case'select':this.menuOrigin=this.state;this.selectPurpose='choose';this.selected=this.save.data.selected;this.setState('CHARACTER_SELECT');break;
 case'confirm-character':{this.save.data.selected=this.selected;this.save.write();if(this.selectPurpose==='new')this.startNew();else if(this.menuOrigin==='PAUSED'||this.menuOrigin==='GAME_OVER'){const old=this.player;this.player=new Player(this,old.x,old.dead?400:old.y);this.player.hp=Math.min(this.player.spec.hp,old.hp>0?old.hp:this.player.spec.hp);this.player.vy=old.vy;this.setState(this.menuOrigin);}else this.setState('TITLE');break;}
 case'continue':this.immersive();this.resumeSave();break;case'pause':this.pause();break;case'resume':this.setState('PLAYING');break;
 case'restart':this.loadLevel(this.levelIndex);this.store();break;case'retry':this.retry();break;
 case'settings':this.menuOrigin=this.state;this.setState('SETTINGS');break;case'help':this.menuOrigin=this.state;this.setState('HOW_TO_PLAY');break;case'credits':this.menuOrigin=this.state;this.setState('CREDITS');break;
 case'back':this.setState(this.menuOrigin||'TITLE');break;
 case'title':if(this.state==='PAUSED')this.store();this.menuOrigin='TITLE';this.setState('TITLE');break;
 case'next':this.loadLevel(this.levelIndex+1);this.store();break;
 case'fullscreen':this.toggleFullscreen();break;
 }}
 retry(){this.lives=3;this.loadLevel(this.levelIndex,true);this.store();}
 respawn(){this.lives--;if(this.lives<=0){this.save.data.best=Math.max(this.save.data.best,this.score);this.save.data.campaign=null;this.save.write();this.setState('GAME_OVER');return;}this.player=new Player(this,this.checkpoint===80&&matchMedia('(pointer:coarse)').matches?220:this.checkpoint,400);for(const b of this.bosses)if(!b.dead){b.hp=b.maxHP;b.phase='entry';b.timer=1.3;b.active=false;b.x=b.home;b.y=480-b.h;b.vy=0;b.vx=0;}this.projectiles=[];this.camera.x=clamp(this.checkpoint-W*.37,0,this.level.width-W);this.transition=.7;this.notify('De volta ao checkpoint · '+this.lives+' vida'+(this.lives>1?'s':''),2);this.store();}
 complete(){this.audio.play('victory');this.score+=1000;this.save.data.best=Math.max(this.save.data.best,this.score);this.save.data.records[this.levelIndex]=Math.max(this.save.data.records[this.levelIndex],this.score);if(this.levelIndex===3){this.save.data.campaign=null;this.save.write();this.setState('VICTORY');}else{this.save.data.unlocked=Math.max(this.save.data.unlocked,this.levelIndex+1);this.save.data.campaign={level:this.levelIndex+1,score:this.score,stars:this.stars,time:this.totalTime,lives:this.lives,checkpoint:80,collected:[],defeated:[]};this.save.write();this.setState('LEVEL_COMPLETE');}}
 update(dt){this.totalTime+=dt;this.levelTime+=dt;this.transition=Math.max(0,this.transition-dt*2.2);this.saveTimer+=dt;LevelManager.update(this.level,dt,this.levelTime,this);this.player.update(dt);if(this.state!=='PLAYING')return;const p=this.player;
 for(const e of this.enemies)if(Math.abs(e.x-p.x)<W+150)e.update(dt);for(const b of this.bosses){if(this.levelIndex===3&&b.kind==='heitor'&&!this.bosses[0].dead)continue;b.update(dt);}
 for(const b of this.projectiles)b.update(dt,this);this.projectiles=this.projectiles.filter(b=>b.life>0).slice(-130);for(const k of this.lightnings)k.t-=dt;this.lightnings=this.lightnings.filter(k=>k.t>0);this.particles.update(dt);
 if(!p.dead){for(const h of this.level.hazards)if(overlap(p,h))p.hurt(1.3);for(const it of this.level.items){if(it.taken)continue;if(Math.abs(it.x-(p.x+18))<28&&Math.abs(it.y-(p.y+30))<44){if(it.type==='heart'&&p.hp>=p.spec.hp)continue;it.taken=true;this.collected.add(it.id);if(it.type==='heart'){p.hp=Math.min(p.spec.hp,p.hp+2);this.audio.play('checkpoint');}else{this.stars++;this.score+=it.type==='gold'?500:50;this.audio.play('star');}this.particles.burst(it.x,it.y,it.type==='heart'?'#f6a4b9':'#ffe28b',12,130);}}
 for(const cp of this.level.checkpoints)if(!cp.active&&Math.abs(p.x-cp.x)<44&&p.y+p.h>420){cp.active=true;this.checkpoint=cp.x;p.hp=p.spec.hp;this.audio.play('checkpoint');this.particles.burst(cp.x+15,405,'#a6ffe0',25,180);this.notify('Checkpoint! Vida recuperada.',2);this.store();}
 if(p.x>this.level.exit-35&&p.grounded){if(this.bosses.every(b=>b.dead)){this.complete();return;}else if(this.levelTime%3<dt)this.notify('Derrote o chefão para liberar a saída.',2);}}
 this.camera.update(dt,p,this.level);if(this.saveTimer>5){this.saveTimer=0;this.store();}
 }
}
const game=new Game();
const fitUI=()=>{const shell=$('#shell'),ui=$('#ui');W=Math.max(1,Math.round(shell.clientWidth/shell.clientHeight*540));const canvas=$('#game');if(canvas.width!==W)canvas.width=W;const scale=shell.clientHeight/540;ui.style.width=W+'px';ui.style.transform='scale('+scale+')';ui.style.setProperty('--touch-size',(clamp(shell.clientHeight*.145,46,72)/scale)+'px');};
new ResizeObserver(fitUI).observe($('#shell'));fitUI();
</script></body></html>
